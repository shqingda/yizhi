# Resume Studio — Cloudflare Workers + static SPA + D1
# Local: `pnpm dev` (Vite + @cloudflare/vite-plugin emulates D1)
# Deploy: create a D1 database, replace database_id, then `pnpm deploy`

name = "resume-studio"
main = "./src/worker/index.ts"
# Must be <= the local workerd binary. Bump when you upgrade wrangler/workerd.
compatibility_date = "2026-08-18"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[observability]
enabled = true

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "resume-studio"
database_id = "5fdb93eb-85f9-4453-89ae-fa7bcc0f3f42"
migrations_dir = "drizzle"
