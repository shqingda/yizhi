# Pre-approve build scripts for packages that download or compile native
# bindings. Without these, pnpm 11+ aborts the install with
# ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  core-js: set this to true or false

# rollup@4.63.2 landed today and fails pnpm's default 24h minimumReleaseAge.
# Pin the last mature release until 4.63.2 is old enough to install.
overrides:
  rollup: 4.63.1
